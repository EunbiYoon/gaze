# COCO-Search18 target-present images with human search fixations (tools/convert_coco_search18.py).
# Adds human-gaze agreement metrics and a CGL-style coverage loss on the saccade head (gaze_coef).
_base: base.yaml
data: {ann: data/coco_search18/annotations.json, images: data/coco_search18/images}
cache_dir: cache/coco_search18
results_dir: results/coco_search18
specs:                                   # query == category here ("a clock"), so clip_name is redundant
  oracle:       {type: oracle}
  clip_full:    {type: clip, prompts: [full]}
  clip_pe_mean: {type: clip_ens, kappa: 0.0,  prompts: [full, para1, para2, para3, para4, para5]}
  clip_pe_pess: {type: clip_ens, kappa: auto, prompts: [full, para1, para2, para3, para4, para5]}
  learned:      {type: learned, kappa: 0.0}
  learned_pess: {type: learned, kappa: auto}
  clip_full_cgl: {type: clip, prompts: [full], gaze_coef: 0.5}   # same proxy + human-gaze coverage loss
  learned_cgl:   {type: learned, kappa: 0.0, gaze_coef: 0.5}
compare:
  - [clip_full_cgl, clip_full]
  - [learned_cgl, learned]
  - [clip_pe_pess, clip_pe_mean]
  - [learned_pess, learned]
  - [clip_full, oracle]
